repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: detect-private-key
  - repo: local
    hooks:
      - id: phoenix-doctor
        name: Phoenix Repository Doctor
        entry: python -m phoenix doctor
        language: system
        pass_filenames: false
      - id: phoenix-tests
        name: Phoenix Development Tests
        entry: python -m phoenix test
        language: system
        pass_filenames: false
