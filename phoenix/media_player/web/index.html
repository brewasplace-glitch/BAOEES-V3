<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PHOENIX DE TV — Open-Source Media Player</title>
<style>
html,body{margin:0;height:100%;background:#02070d;color:#eef8ff;font-family:Segoe UI,Arial,sans-serif}
#app{height:100%;display:grid;grid-template-rows:1fr auto;background:#02070d}
#stage{min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#02070d}
#stage img,#stage video,#stage iframe,#stage object{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;border:0}
#controls{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;padding:8px;border-top:1px solid #174565;background:#061523}
button,input{background:#092944;color:#fff;border:1px solid #22658a;border-radius:8px;padding:10px;font-weight:600}
#command{grid-column:1/4}
#meta{grid-column:1/5;font-size:12px;color:#9ed6f0}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><div>PHOENIX OPEN-SOURCE MEDIA PLAYER — GEREED</div></div>
  <div id="controls">
    <button id="prev">◀ VORIGE</button>
    <button id="play">PRESENTATIE</button>
    <button id="next">VOLGENDE ▶</button>
    <button id="full">VOL SCHERM</button>
    <input id="command" placeholder="toon ontwerp / interieur / vogelvlucht / achterzijde">
    <button id="show">TOON</button>
    <div id="meta">Geen media geselecteerd.</div>
  </div>
</div>
<script src="/player/player.js"></script>
</body>
</html>
