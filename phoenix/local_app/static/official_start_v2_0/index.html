<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Phoenix 2.0</title><style>
html,body{margin:0;width:100%;height:100%;background:#020b18;overflow:hidden;font-family:Segoe UI,Arial,sans-serif}#screen{position:fixed;inset:0;background:url("phoenix_official_start_screen_v2_0.png") center/contain no-repeat}.hotspot{position:absolute;border:0;background:transparent;cursor:pointer}.hotspot:hover,.hotspot:focus{outline:2px solid rgba(0,153,255,.8);box-shadow:0 0 18px rgba(0,153,255,.5);border-radius:10px}#start{left:31.8%;top:84.1%;width:43.8%;height:7.3%}#upload{left:18.2%;top:37.4%;width:27.2%;height:15.5%}#speech{left:47.6%;top:37.3%;width:26.2%;height:15.5%}#bouw{left:18.7%;top:16.2%;width:16.7%;height:16.1%}#civiel{left:36.3%;top:16.2%;width:16.3%;height:16.1%}#infra{left:53.2%;top:16.2%;width:15%;height:16.1%}#message{position:fixed;left:50%;bottom:3.5%;transform:translateX(-50%);display:none;background:#071a2f;color:white;padding:12px 20px;border:1px solid #1689ff;border-radius:9px;box-shadow:0 0 24px rgba(0,130,255,.45);z-index:5}input{display:none}</style></head><body><div id="screen"><button class="hotspot" id="bouw"></button><button class="hotspot" id="civiel"></button><button class="hotspot" id="infra"></button><button class="hotspot" id="upload"></button><button class="hotspot" id="speech"></button><button class="hotspot" id="start"></button><input id="filePicker" type="file" multiple accept=".pdf,.docx,.xlsx,.dwg,.dxf,.ifc,.rvt,.skp,.jpg,.jpeg,.png,.shp,.geojson"></div><div id="message"></div><script>
const msg=t=>{const m=document.getElementById('message');m.textContent=t;m.style.display='block';clearTimeout(window.__m);window.__m=setTimeout(()=>m.style.display='none',3500)};let type='BOUW';['bouw','civiel','infra'].forEach(id=>document.getElementById(id).onclick=()=>{type=id.toUpperCase();msg('Projecttype geselecteerd: '+type)});document.getElementById('upload').onclick=()=>document.getElementById('filePicker').click();document.getElementById('filePicker').onchange=e=>msg(e.target.files.length+' bestand(en) geselecteerd');document.getElementById('speech').onclick=()=>msg('Spraakinvoer wordt geopend via de lokale Phoenix-runtime');document.getElementById('start').onclick=()=>{localStorage.setItem('phoenix_project_type',type);location.href='http://127.0.0.1:8765/'};
</script></body></html>
